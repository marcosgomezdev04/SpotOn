info:
  name: putUser
  type: http

http:
  method: PUT
  url: "{{baseUrl}}/user/update/{{userId}}"
  headers:
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |-
      {
          "name": "Test505",
          "email": "Test505@gmail.com",
          "password": "Test505"
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
