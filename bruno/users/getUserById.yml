info:
  name: getUserById
  type: http
  seq: 1

http:
  method: GET
  url: "{{baseUrl}}/user/getById/{{userId}}"
  headers:
    - name: Content-Type
      value: application/json
  auth:
    type: bearer
    token: "{{token}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
