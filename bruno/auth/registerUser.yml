info:
  name: registerUser
  type: http
  seq: 1

http:
  method: POST
  url: http://localhost:3000/auth/register
  headers:
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |-
      {
          "name": "prueba",
          "email": "prueba@gmail.com",
          "password": "prueba12345"
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
